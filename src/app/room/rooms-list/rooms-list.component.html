

<!-- This is the samrt component..! and the parent is the dmb component..! -->

<div>
    <h2>{{title}}</h2>

    <table>
        <thead>
            <tr>    
                <th>Index</th>
                <th>Modulo</th>
                <th>Room Number</th>
                <th>Room Type</th>
                <th>Room price</th>
                <th>Room servics</th>   
                <th>check In</th>   
                <th>check Out</th>   
                <th>click to Select </th>
            </tr>
        </thead>
        
        <!-- Just the info that what are the things that the table or the ngfor is havign -->
        
        <tbody>
            <tr [ngClass]=" e ? 'even' : 'odd'" *ngFor="let room of rooms; let e=even ; let o=odd ; let i=index ">
                <td>{{i}}</td>
                <td>{{e ? 'Even' : 'Odd' }}</td>
                <td>{{room.roomNumber}}</td>
                <td>{{room.roomType}}</td>
                <td>{{room.price}}</td>
                <td>{{room.amenities}}</td>
                <td>{{room.checkInTime}}</td>
                <td>{{room.checkOutTime | date :'short'}}</td> 
                <td>
                    <button type="button" class="btn btn-dark" (click)="selectRoom(room)">
                        Select Room
                    </button>
                </td>
            </tr>
        </tbody>
        
    </table>
</div>
